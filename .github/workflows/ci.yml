name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 编译 / 风格检查 / 测试 / 覆盖率门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 用 verify 而非 test：checkstyle(validate) / jacoco check(verify) /
      # spring-boot repackage(package) 都在 test 之后的阶段，只有 verify 全覆盖
      # 用 clean 而非增量：改了编译参数（如 -parameters）时增量编译不会重编主代码
      - name: Verify (compile + checkstyle + tests + coverage gate)
        run: mvn -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload checkstyle report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 7

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 只验证 Dockerfile 能构建成功，不推送镜像
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smart-library-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
