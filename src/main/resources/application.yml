server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-library-agent
  # 用 default 而非 active：不带 profile 启动时走 dev（H2 文件库），
  # 显式指定 profile 仍可覆盖，便于 Docker/CI 注入
  profiles:
    default: dev
  jpa:
    show-sql: false
    open-in-view: false
  cache:
    type: caffeine
    cache-names: bookRecommendation
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: smart-library-agent
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

library:
  chat:
    # Agent 单次调用的超时上限，超时返回 504 而非无限等待
    timeout: 60s
  recommend:
    # 余弦相似度下限。向量检索在 top-k 上总能返回结果，即使图书与查询毫无关系；
    # 低于该分数视为不相关直接丢弃，宁可返回空让上层如实说"没有相关馆藏"，也不凑数。
    # 取值需用真实查询的 topScore 日志校准：太高会漏掉相关图书，太低等于没有阈值。
    min-score: 0.3
  session:
    # 会话记忆实例上限与空闲回收时间。会话内存放在进程内，
    # 多实例部署时应改为外部存储（如 Redis）共享
    max: 500
    ttl: 30m
  embedding:
    connect-timeout: 5s
    read-timeout: 15s
  vector-init:
    # 关闭后不在启动时构建向量索引（用于测试/离线环境）
    enabled: true

# 设置该变量后自动切换到硅基流动 BGE 中文向量模型，否则走百炼 DashScope
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}

agentscope:
  dashscope:
    # 不再给占位符默认值：占位符会让应用"能启动但每次都 401"，
    # 是比启动失败更难排查的静默错误配置。缺失时由 AgentConfig 显式拒绝启动。
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: qwen-plus

  agent:
    name: "图书馆助手"
    sys-prompt: |
      你是学校图书馆的智能助手，可以用中文帮读者查书、借书、还书、推荐图书。
      当用户表达阅读需求或兴趣（如"想学并发编程"、"有什么算法书推荐"）时，优先使用 recommend_book 做语义推荐。
      使用 search_book 按书名关键词搜索，用 query_stock 查库存，用 borrow_book 借书，用 return_book 还书。
      回答必须以工具返回的真实数据为准，禁止编造 ISBN、库存状态和馆藏位置。
      当工具返回「未找到」「暂无相关馆藏」时，如实告知读者，不要推荐不存在的图书，也不要虚构书目信息。
      信息不确定时明确说明不确定，并建议读者换一种描述或改用关键词搜索。
      回答要简洁友好，每次操作后主动询问读者是否还需要其他帮助。
