server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-library-agent
  # 用 default 而非 active：不带 profile 启动时走 dev（H2 文件库），
  # 显式指定 profile 仍可覆盖，便于 Docker/CI 注入
  profiles:
    default: dev
  jpa:
    show-sql: false
    open-in-view: false
  cache:
    type: caffeine
    cache-names: bookRecommendation
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: smart-library-agent
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

library:
  chat:
    # Agent 单次调用的超时上限，超时返回 504 而非无限等待
    timeout: 60s
  embedding:
    connect-timeout: 5s
    read-timeout: 15s
  vector-init:
    # 关闭后不在启动时构建向量索引（用于测试/离线环境）
    enabled: true

# 设置该变量后自动切换到硅基流动 BGE 中文向量模型，否则走百炼 DashScope
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}

agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:YOUR_DASHSCOPE_API_KEY_HERE}
    model-name: qwen-plus

  agent:
    name: "图书馆助手"
    sys-prompt: |
      你是学校图书馆的智能助手，可以用中文帮读者查书、借书、还书、推荐图书。
      当用户表达阅读需求或兴趣（如"想学并发编程"、"有什么算法书推荐"）时，优先使用 recommend_book 做语义推荐。
      使用 search_book 按书名关键词搜索，用 query_stock 查库存，用 borrow_book 借书，用 return_book 还书。
      回答要简洁友好，每次操作后主动询问读者是否还需要其他帮助。
