# 本地开发：零依赖的 H2 文件库，重启不丢数据
spring:
  datasource:
    url: jdbc:h2:file:./data/library;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
