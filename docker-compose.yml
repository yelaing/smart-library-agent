services:
  app:
    build: .
    image: smart-library-agent:latest
    ports:
      - "8080:8080"
    environment:
      # 用 prod profile 走 MySQL —— 这样下面的 mysql 服务才真正被用到。
      # 原先这里写的是 dev（对应 H2 文件库），却又声明 depends_on: mysql，语义是矛盾的。
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: library
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_PASSWORD:-root}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      # 用 :? 让 compose 在缺 key 时立刻给出可操作的报错，
      # 而不是把容器拉起来再崩溃（五个工具只经 LLM tool calling 暴露，缺 key 时服务无任何功能）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY 未配置，请复制 .env.example 为 .env 并填入百炼 API Key}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    # 健康检查由镜像内的 HEALTHCHECK 提供（见 Dockerfile），此处不重复定义

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: library
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 用 $$ 让 compose 输出字面 $，交由容器内的 shell 读取 MYSQL_ROOT_PASSWORD，
      # 避免把密码硬编码进 compose 文件
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
